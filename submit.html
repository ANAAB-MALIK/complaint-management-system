<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">CMS</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="submit.html">Submit Complaint</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-complaints.html">My Complaints</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- SUBMIT FORM -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7">
                    <div class="card shadow p-4">
                        <h2 class="text-center mb-4">Submit New Complaint</h2>
                        <form>
                            <div class="mb-3">
                                <label>Complaint Title</label>
                                <input type="text" class="form-control" placeholder="Enter complaint title">
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label>Category</label>
                                    <select class="form-select">
                                        <option>Select Category</option>
                                        <option>Hostel</option>
                                        <option>Fee</option>
                                        <option>Faculty</option>
                                        <option>Facilities</option>
                                        <option>Other</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label>Priority</label>
                                    <select class="form-select">
                                        <option>Select Priority</option>
                                        <option>Low</option>
                                        <option>Medium</option>
                                        <option>High</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label>Description</label>
                                <textarea class="form-control" rows="4" placeholder="Describe your complaint in detail"></textarea>
                            </div>
                            <div class="mb-3">
                                <label>Attach File (Optional)</label>
                                <input type="file" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Submit Complaint</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3">
        <p>© 2026 Complaint Management System</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
