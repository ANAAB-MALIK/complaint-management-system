<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body class="admin-body">

    <!-- ADMIN LOGIN FORM -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow p-4">
                        <h2 class="text-center mb-2">🔐 Admin Login</h2>
                        <p class="text-center text-muted mb-4">Complaint Management System</p>
                        <form>
                            <div class="mb-3">
                                <label>Admin Email</label>
                                <input type="email" class="form-control" placeholder="Enter admin email">
                            </div>
                            <div class="mb-3">
                                <label>Password</label>
                                <input type="password" class="form-control" placeholder="Enter password">
                            </div>
                            <button type="submit" class="btn btn-danger w-100">Login as Admin</button>
                            <p class="text-center mt-3"><a href="../index.html">← Back to Main Site</a></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
